# Kontrak production-like. BUKAN deploy; hanya untuk uji lokal.
services:
  app:
    image: portofolio-landing:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: .docker/Dockerfile
      target: runtime
    ports:
      - "127.0.0.1:${APP_PORT:-18130}:8080"
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      retries: 5
